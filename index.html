  <title>Haven Church — A place to belong</title>

  <div id="app">

  <script>
const demoMembers = [
 {id:'demo-1',name:'Kea Mokoena',email:'kea@example.org',role:'MEMBER',status:'PENDING',created_at:'2026-10-14'},
 {id:'demo-2',name:'Sipho Mbatha',email:'sipho@example.org',role:'MEMBER',status:'PENDING',created_at:'2026-10-14'},
 {id:'demo-3',name:'Lebo Nkosi',email:'lebo@example.org',role:'YOUTH_LEADER',status:'APPROVED',created_at:'2026-09-12'}
];
const demoEvents = [
 {id:'demo-e1',title:'Sunday Gathering (sample)',starts_at:'2026-11-01T09:00:00Z',location:'Example community hall',ministry:'General',visibility:'PUBLIC'},
 {id:'demo-e2',title:'Youth Connect (sample)',starts_at:'2026-11-07T16:00:00Z',location:'Example youth space',ministry:'Youth',visibility:'MEMBERS'}
];
const demoAnnouncements=[{id:'demo-a1',title:'Welcome to the Haven portal (sample)',body:'This is placeholder content for the design preview. Your real church announcements will appear here.',visibility:'MEMBERS',created_at:'2026-10-15'}];
window.fetch=async function(url,opts={}){
 const path=String(url).split('?')[0];let data={};
 if(path==='/api/me') data={user:{id:'demo-owner',name:'Alex Jordan',email:'alex@example.org',status:'APPROVED',role:'SUPER_ADMIN'}};
 else if(path==='/api/dashboard') data={events:demoEvents.length,pending:demoMembers.filter(m=>m.status==='PENDING').length};
 else if(path==='/api/events') {if(opts.method==='POST'){const item=JSON.parse(opts.body);demoEvents.push({id:'demo-e'+Date.now(),...item});data={ok:true}}else data={items:demoEvents};}
 else if(path==='/api/announcements') {if(opts.method==='POST'){const item=JSON.parse(opts.body);demoAnnouncements.unshift({id:'demo-a'+Date.now(),created_at:new Date().toISOString(),...item});data={ok:true}}else data={items:demoAnnouncements};}
 else if(path==='/api/members') data={items:demoMembers};
 else if(path.startsWith('/api/members/')) {const parts=path.split('/');const m=demoMembers.find(x=>x.id===parts[3]);if(m&&opts.body){const d=JSON.parse(opts.body);Object.assign(m,d)}data={ok:true};}
 else if(path==='/api/assistant') data={answer:'This is a design demonstration. Connect Cloudflare Workers AI and Google login to use the real approved-member assistant.'};
 else if(path==='/api/knowledge') data=opts.method==='POST'?{ok:true}:{items:[{id:'example',question:'How can I get involved?',answer:'Speak with a ministry leader to learn about serving.'}]};
 else if(path==='/api/audit') data={items:[]};
 else if(opts.method==='DELETE') data={ok:true};
 else data={ok:true};
 return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}});
};

// No front-end dependencies: fast, accessible, framework-independent source.
const app=document.getElementById('app');
const ui={user:null,view:'site',tab:'overview',menu:false,events:[],announcements:[],members:[],knowledge:[],audit:[],dashboard:{},chat:[],filter:'PENDING',busy:false,flash:null};

const E=escapeHTML;

 heart:'<path d="M12 21.2 3.8 13A6 6 0 0 1 12 4.4 6 6 0 0 1 20.2 13L12 21.2Z"/>',

 home:'<path d="m12 2 10 9h-2v10h-6v-7h-4v7H4V11H2L12 2Z"/>',

 edit:'<path d="M17.8 2.4a2 2 0 0 1 2.8 2.8l-2 2-2.8-2.8 2-2Zm-3.4 3.4 2.8 2.8-9.9 9.9L4 19.3l.8-3.3 9.6-10.2ZM3 21h18v1H3v-1Z"/>',
 check:'<path d="m9 17-5-5 1.5-1.5L9 14l9.5-9.5L20 6l-11 11Z"/>',
 'check-circle':'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.5 14.8-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/>',
 x:'<path d="m6 5 6 6 6-6 1.5 1.5-6 6 6 6L18 20l-6-6-6 6-1.5-1.5 6-6-6-6L6 5Z"/>',
 menu:'<path d="M3 5h18v2H3V5Zm0 6h18v2H3v-2Zm0 6h18v2H3v-2Z"/>',
 send:'<path d="m2 3 20 9-20 9 2-8 10-1-10-1-2-8Z"/>',
 logout:'<path d="M10 2H3v20h7v-2H5V4h5V2Zm4 4-1.5 1.5 3.5 3.5H8v2h8l-3.5 3.5L14 18l6-6-6-6Z"/>',
 info:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1 4h2v2h-2V6Zm0 4h2v8h-2v-8Z"/>',
 'person-plus':'<path d="M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 10c-4 0-7 2.4-7 5v3h14v-3c0-2.6-3-5-7-5Zm10-6h-2v3h-3v2h3v3h2v-3h3v-2h-3V7Z"/>',
 leaf:'<path d="M20.5 2C11.3 2 4 5.8 4 13a7 7 0 0 0 1.3 4L2 20l1.5 1.5 3.4-3.4A7 7 0 0 0 11 20c8.5 0 12-9 9.5-18Z"/>',
 pin:'<path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/>',
 plus:'<path d="M11 3h2v8h8v2h-8v8h-2v-8H3v-2h8V3Z"/>',
 lock:'<path d="M18 9V7a6 6 0 0 0-12 0v2H4v13h16V9h-2ZM8 7a4 4 0 0 1 8 0v2H8V7Zm4 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>',
 bell:'<path d="M12 2a2 2 0 0 1 2 2c3 .8 4 3.1 4 6v5l2 3H4l2-3v-5c0-2.9 1-5.2 4-6a2 2 0 0 1 2-2Zm-3 18h6a3 3 0 0 1-6 0Z"/>'
};
const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]||iconPaths.heart}</svg>`;
const brand=(light=false)=>`<a href="#home" class="brand" data-action="site"><span class="brand-symbol"><span></span></span><span>haven<span style="color:${light?'#d9c09b':'#799884'}">.</span></span></a>`;
const pill=(status)=>`<span class="tag ${E(status.toLowerCase())}">${E(status.replace('_',' '))}</span>`;
const fmtDate=(value)=>{const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''};
const eventRow=(x)=>`<div class="list-row"><div class="row-icon">${icon('calendar')}</div><div><h3>${E(x.title)}</h3><p>${E(fmtDate(x.starts_at))} · ${E(x.location||'Location to be confirmed')} · ${E(x.ministry)}</p></div><span class="tag" style="margin-left:auto">${E(x.visibility)}</span></div>`;
async function api(path,options={}){
 const response=await fetch(path,{credentials:'same-origin',headers:{...(options.body?{'Content-Type':'application/json'}:{}),...options.headers},...options});
 let data;try{data=await response.json()}catch{data={error:'A server response could not be read'}}
 if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);
 return data;
}
async function loadPublic(){
 const [events,announcements]=await Promise.allSettled([api('/api/events'),api('/api/announcements')]);
 if(events.status==='fulfilled')ui.events=events.value.items||[];
 if(announcements.status==='fulfilled')ui.announcements=announcements.value.items||[];
}
async function loadPortal(){
 if(!ui.user||ui.user.status!=='APPROVED')return;
 const requests=[api('/api/dashboard'),api('/api/events'),api('/api/announcements')];
 const [dashboard,events,announcements]=await Promise.allSettled(requests);
 if(dashboard.status==='fulfilled')ui.dashboard=dashboard.value;
 if(events.status==='fulfilled')ui.events=events.value.items||[];
 if(announcements.status==='fulfilled')ui.announcements=announcements.value.items||[];
}
function site(){return `<div class="site">
 <div class="noticebar"><div class="wrap noticeinner">${icon('sparkle')}<span>There's always a place for you here.</span><a href="#visit" data-action="scroll" data-target="visit">Plan your first visit ${icon('arrow')}</a></div></div>
 <header class="site-header"><div class="wrap header-inner">${brand()}<nav class="navlinks ${ui.menu?'open':''}" aria-label="Main navigation">
   <a href="#about" data-action="scroll" data-target="about">Our story</a><a href="#ministries" data-action="scroll" data-target="ministries">Ministries</a><a href="#events" data-action="scroll" data-target="events">What's on</a><a href="#visit" data-action="scroll" data-target="visit">Visit us</a>
 </nav><div class="nav-actions"><button type="button" class="btn btn-dark" data-action="portal">${ui.user?'My portal':'Member portal'} ${icon('arrow')}</button><button type="button" class="mobile-menu" data-action="menu" aria-label="Toggle navigation" aria-expanded="${ui.menu}">${icon('menu')}</button></div></div></header>
 <main><div class="wrap hero-shell"><section class="hero" aria-labelledby="hero-title"><div class="hero-copy"><div class="eyebrow hero-kicker">Welcome home to Haven Church</div><h1 class="display hero-title" id="hero-title">Room to <span class="italic">belong.</span><br>Space to <span class="italic">become.</span></h1><p class="hero-sub">Life is better when we walk it together. Come as you are, find your people, and discover a faith that feels like home.</p><div class="hero-actions"><a href="#visit" class="btn btn-primary" data-action="scroll" data-target="visit">Plan your visit ${icon('arrow')}</a><a href="#about" class="btn btn-plain" data-action="scroll" data-target="about">Get to know us ${icon('arrow-up')}</a></div><a href="#about" class="hero-scroll" data-action="scroll" data-target="about">${icon('arrow')} Discover our community</a></div><div class="hero-visual" role="img" aria-label="A community gathered in worship"><div class="photo-arch"></div><div class="circle-orbit">${icon('heart')}</div><div class="hero-sticker"><div class="sticker-icon">${icon('heart')}</div><div><strong>You belong here.</strong><span>Faith. Family. Purpose.</span></div></div></div></section></div>
 <div class="wrap trustline"><div class="trust-item">${icon('heart')} A community that cares</div><div class="trust-item">${icon('book')} Rooted in faith & purpose</div><div class="trust-item">${icon('users')} Room for every generation</div></div>
 <section class="section" id="about"><div class="wrap welcome-grid"><div class="welcome-image" role="img" aria-label="An illustration of the cross and the word together"><div class="cross-circle"></div><div class="wordmark">together, always.</div></div><div class="welcome-text"><div class="eyebrow">A little about us</div><h2 class="section-title">More than a Sunday. <span class="italic">A place for life.</span></h2><p class="lead">We believe church should feel like family. A welcoming space to ask questions, build meaningful relationships and grow in faith, one step at a time.</p><div class="value-list"><div class="value"><div class="round-icon">${icon('heart')}</div><div><h3>Come as you are</h3><p>There's no perfect version of you required to belong here.</p></div></div><div class="value"><div class="round-icon">${icon('users')}</div><div><h3>Grow together</h3><p>Faith deepens through connection, curiosity and community.</p></div></div><div class="value"><div class="round-icon">${icon('leaf')}</div><div><h3>Make a difference</h3><p>Find purpose by caring for the people around you.</p></div></div></div><a href="#visit" class="btn btn-dark" data-action="scroll" data-target="visit">Find your place ${icon('arrow')}</a></div></div></section>
 <section class="section ministries" id="ministries"><div class="wrap"><div class="section-heading"><div><div class="eyebrow">Find your people</div><h2 class="section-title">Life happens <span class="italic">together.</span></h2></div><p>There's a space for every age and every stage of life. Discover where you can connect, serve and grow.</p></div><div class="cards3">
 <article class="ministry-card"><div class="card-art"><div class="round-icon big">${icon('users')}</div>${icon('arrow-up')}</div><h3>Young & thriving</h3><p>Real conversations, real friendships and meaningful moments for the next generation.</p><a href="#events" data-action="scroll" data-target="events" class="card-link">Youth ministry ${icon('arrow')}</a></article>
 <article class="ministry-card"><div class="card-art"><div class="round-icon big">${icon('heart')}</div>${icon('arrow-up')}</div><h3>Better together</h3><p>Build community through connection groups, shared experiences and genuine care.</p><a href="#events" data-action="scroll" data-target="events" class="card-link">Community groups ${icon('arrow')}</a></article>
 <article class="ministry-card"><div class="card-art"><div class="round-icon big">${icon('compass')}</div>${icon('arrow-up')}</div><h3>Purpose in action</h3><p>Serve with heart, use your gifts and make a lasting difference in your community.</p><a href="#visit" data-action="scroll" data-target="visit" class="card-link">Get involved ${icon('arrow')}</a></article>
 </div></div></section>
 <section class="section" id="events"><div class="wrap"><div class="section-heading"><div><div class="eyebrow">There's more happening</div><h2 class="section-title">What's coming <span class="italic">up.</span></h2></div><p>New moments to connect, grow and make memories. Events published by your church leadership will appear here.</p></div><div class="event-list">${ui.events.filter(x=>x.visibility==='PUBLIC').slice(0,4).map(x=>{const d=new Date(x.starts_at);return `<article class="event-card"><div class="date-chip"><strong>${E(d.getDate())}</strong><span>${E(d.toLocaleDateString(undefined,{month:'short'}))}</span></div><div><h3>${E(x.title)}</h3><p>${icon('clock')} ${E(d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}))}</p><p>${icon('pin')} ${E(x.location||'Location to be announced')}</p></div><span class="arrow-trail">${icon('arrow-up')}</span></article>`}).join('')||`<div class="empty-state" style="grid-column:1/-1">${icon('calendar')}<h3>Good things are coming</h3><p>Upcoming events will appear here once your church leadership publishes them.</p></div>`}</div></div></section>
 <section class="cta" id="visit"><div class="wrap"><div class="cta-inner"><div><div class="eyebrow" style="color:#d8bb8c">Your next step starts here</div><h2>There's a seat<br>with <span class="italic" style="color:#e9c29e">your name on it.</span></h2><p>New here? We would love to welcome you. Connect with the community and take your first step at your own pace.</p></div><div><button class="btn btn-light" data-action="portal">Join the community ${icon('arrow')}</button><p class="preview-note" style="color:#bbc9bb">Signing up with Google starts a membership approval request.</p></div></div></div></section></main>
 <footer class="site-footer"><div class="wrap"><div class="footer-grid"><div class="footer-brand">${brand(true)}<p>A place to belong, a faith to grow and a community to call home.</p></div><div><div class="footer-head">Explore</div><div class="footer-links"><a href="#about" data-action="scroll" data-target="about">Our story</a><a href="#ministries" data-action="scroll" data-target="ministries">Ministries</a><a href="#events" data-action="scroll" data-target="events">Events</a></div></div><div><div class="footer-head">Connect</div><div class="footer-links"><a href="#visit" data-action="scroll" data-target="visit">Plan a visit</a><a href="#portal" data-action="portal">Member portal</a><a href="#home" data-action="site">Back to top</a></div></div></div><div class="footer-base"><span>© ${new Date().getFullYear()} Haven Church. Built for belonging.</span><span>Open source • Privacy-first • Made with care</span></div></div></footer></div>`}
function menuTabs(){const tabs=[['overview','grid','Overview'],['events','calendar','Events'],['announcements','bell','Announcements'],['assistant','message','Church assistant']];if(['ADMIN','SUPER_ADMIN'].includes(ui.user?.role)){tabs.push(['members','users','Members'],['manage','edit','Manage content']);}if(ui.user?.role==='YOUTH_LEADER')tabs.push(['manage','edit','Youth events']);if(ui.user?.role==='SUPER_ADMIN')tabs.push(['audit','shield','Security log']);return tabs}
function sidebar(){return `<aside class="sidebar">${brand(true)}<div class="side-label">YOUR SPACE</div><nav class="side-nav" aria-label="Member portal">${menuTabs().map(([id,ico,name])=>`<button type="button" class="side-item ${ui.tab===id?'active':''}" data-action="tab" data-tab="${id}">${icon(ico)} ${E(name)}</button>`).join('')}</nav><div class="sidebar-spacer"></div><button type="button" class="logout" data-action="logout">${icon('logout')} Sign out of Haven</button><div class="side-profile"><span class="avatar">${ui.user.avatarUrl?`<img src="${E(ui.user.avatarUrl)}" alt="">`:E(ui.user.name?.slice(0,1).toUpperCase())}</span><div><strong>${E(ui.user.name)}</strong><small>${E(ui.user.role.replace('_',' ').toLowerCase())}</small></div></div></aside>`}
function portal(){if(!ui.user)return site();if(ui.user.status!=='APPROVED')return pending();return `<div class="portal">${sidebar()}<div class="portal-main"><header class="portal-header"><span class="crumb">Haven Church <span style="padding:0 12px">/</span> <strong>${E(menuTabs().find(t=>t[0]===ui.tab)?.[2]||'Overview')}</strong></span><div class="portal-head-actions"><button class="btn btn-outline btn-small" data-action="site">${icon('home')} Website</button><span class="avatar">${ui.user.avatarUrl?`<img src="${E(ui.user.avatarUrl)}" alt="">`:E(ui.user.name?.slice(0,1).toUpperCase())}</span></div></header><main class="portal-content">${portalTab()}</main></div></div>`}
function portalHeading(title,desc,actions=''){return `<div class="portal-welcome"><div><div class="eyebrow" style="color:#8a9988">Member portal</div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}
const empty=(title,desc)=>`<div class="empty-panel">${icon('leaf')}<div><strong>${E(title)}</strong></div><p>${E(desc)}</p></div>`;
function portalTab(){switch(ui.tab){case 'events':return eventsTab();case 'announcements':return announcementsTab();case 'assistant':return assistantTab();case 'members':return membersTab();case 'manage':return manageTab();case 'audit':return auditTab();default:return overviewTab()}}
function overviewTab(){return `${portalHeading(`Welcome back, <span class="italic">${E(ui.user.name.split(' ')[0])}.</span>`,'Your community, conversations and upcoming gatherings — all in one place.',pill(ui.user.role))}
 <div class="portal-stats"><div class="stat"><div class="stat-icon">${icon('calendar')}</div><h3>${Number(ui.dashboard.events||ui.events.length)}</h3><p>Upcoming church events</p></div><div class="stat"><div class="stat-icon">${icon('check-circle')}</div><h3>Active</h3><p>Approved membership</p></div><div class="stat"><div class="stat-icon">${icon('users')}</div><h3>${['ADMIN','SUPER_ADMIN'].includes(ui.user.role)?Number(ui.dashboard.pending||0):'♥'}</h3><p>${['ADMIN','SUPER_ADMIN'].includes(ui.user.role)?'Membership requests awaiting review':'You are part of Haven'}</p></div></div>
 <div class="panel-2"><section class="panel"><div class="panel-title"><div><h2>Upcoming gatherings</h2><p>Here's what's happening in your community.</p></div><button class="btn btn-outline btn-small" data-action="tab" data-tab="events">View all ${icon('arrow')}</button></div>${ui.events.slice(0,4).map(eventRow).join('')||empty('Nothing scheduled yet','Your leaders will publish events here.')}</section><section class="panel"><div class="panel-title"><div><h2>Your corner of Haven</h2><p>Connect and grow in your own time.</p></div></div><div class="list-row"><div class="row-icon">${icon('message')}</div><div><h3>Ask the church assistant</h3><p>Find answers in church-approved resources.</p></div><button class="btn btn-outline btn-small" data-action="tab" data-tab="assistant">Open</button></div><div class="list-row"><div class="row-icon">${icon('bell')}</div><div><h3>Church updates</h3><p>Stay close to what's new.</p></div><button class="btn btn-outline btn-small" data-action="tab" data-tab="announcements">Read</button></div>${['ADMIN','SUPER_ADMIN'].includes(ui.user.role)?`<div class="list-row"><div class="row-icon">${icon('person-plus')}</div><div><h3>Review applicants</h3><p>Approve new people in your care.</p></div><button class="btn btn-outline btn-small" data-action="tab" data-tab="members">Review</button></div>`:''}</section></div>`}
function eventsTab(){return `${portalHeading('Church <span class="italic">events.</span>','Discover upcoming gatherings and ministry activities.')}<section class="panel"><div class="panel-title"><h2>Upcoming events</h2><span class="tag">${ui.events.length} visible to you</span></div>${ui.events.map(eventRow).join('')||empty('No events yet','A leader can create an event from Manage content.')}</section>`}
function announcementsTab(){return `${portalHeading('Latest <span class="italic">updates.</span>','Everything your church leaders want you to know.')}<section class="panel"><div class="panel-title"><h2>Announcements</h2><span class="tag">${ui.announcements.length} updates</span></div>${ui.announcements.map(a=>`<div class="list-row"><div class="row-icon">${icon('bell')}</div><div><h3>${E(a.title)}</h3><p style="white-space:pre-wrap;max-width:700px">${E(a.body)}</p><small class="tiny">${E(fmtDate(a.created_at))} · ${E(a.visibility)}</small></div></div>`).join('')||empty('Nothing posted yet','Announcements will appear here when a leader shares an update.')}</section>`}
function assistantTab(){return `${portalHeading('Your church <span class="italic">assistant.</span>','Thoughtful answers, guided by resources approved by your church leaders.')}<div class="panel assistant-card"><div class="panel-title"><div><h2>${icon('message')} Haven companion</h2><p>Just for approved members. Your messages aren't saved by this app.</p></div><span class="tag">Member access</span></div><div class="chat-messages" aria-live="polite">${ui.chat.length?ui.chat.map(m=>`<div class="bubble ${m.from}">${E(m.text)}</div>`).join(''):`<div class="bubble assistant">Hi ${E(ui.user.name.split(' ')[0])}! Welcome to your community space. You can ask me about church-approved information, getting connected or general questions about faith. What would you like to explore?</div>`}</div><form class="chat-input" data-form="chat"><label class="field" style="flex:1"><span class="tiny">Your message</span><input name="message" maxlength="1000" placeholder="Ask me anything about church life..." required autocomplete="off" aria-label="Your message"></label><button class="btn btn-dark" type="submit" ${ui.busy?'disabled':''} aria-label="Send message">${icon('send')}</button></form><p class="tiny">The assistant can make mistakes. For important decisions, please speak with your leaders.</p></div>`}
function membersTab(){if(!['ADMIN','SUPER_ADMIN'].includes(ui.user.role))return `<div class="notice error">Access denied.</div>`;return `${portalHeading('Membership <span class="italic">requests.</span>','Welcoming new members starts with thoughtful approval.')}<section class="panel"><div class="panel-title"><div><h2>Member directory</h2><p>Approval and roles are enforced by the server.</p></div><div class="filterrow"><label for="member-filter" class="tiny">Status</label><select id="member-filter" data-filter="members"><option value="PENDING" ${ui.filter==='PENDING'?'selected':''}>Pending</option><option value="APPROVED" ${ui.filter==='APPROVED'?'selected':''}>Approved</option><option value="REJECTED" ${ui.filter==='REJECTED'?'selected':''}>Rejected</option><option value="SUSPENDED" ${ui.filter==='SUSPENDED'?'selected':''}>Suspended</option><option value="ALL" ${ui.filter==='ALL'?'selected':''}>All members</option></select></div></div><div class="table-scroll"><table class="members-table"><thead><tr><th>Person</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody>${ui.members.map(m=>`<tr><td><strong>${E(m.name)}</strong><small>${E(m.email)}</small></td><td>${E(m.role.replace('_',' '))}</td><td>${pill(m.status)}</td><td>${E(fmtDate(m.created_at))}</td><td><div class="member-actions">${memberButtons(m)}</div></td></tr>`).join('')||`<tr><td colspan="5">${empty('No members in this view','Select another status or wait for a new sign-up.')}</td></tr>`}</tbody></table></div></section>`}
function memberButtons(m){const myRank={MEMBER:1,YOUTH_LEADER:2,ADMIN:3,SUPER_ADMIN:4};if(m.id===ui.user.id||myRank[ui.user.role]<=myRank[m.role])return `<span class="tiny">Restricted</span>`;
 const options=[];if(m.status!=='APPROVED')options.push(`<button data-action="status" data-id="${E(m.id)}" data-value="APPROVED">${icon('check')} Approve</button>`);
 if(m.status==='PENDING')options.push(`<button data-action="status" data-id="${E(m.id)}" data-value="REJECTED">Reject</button>`);
 if(m.status==='APPROVED')options.push(`<button data-action="status" data-id="${E(m.id)}" data-value="SUSPENDED">Suspend</button>`);
 if(m.status==='SUSPENDED'||m.status==='REJECTED')options.push(`<button data-action="status" data-id="${E(m.id)}" data-value="PENDING">Reset</button>`);
 if(ui.user.role==='SUPER_ADMIN'&&m.status==='APPROVED')options.push(`<button data-action="role" data-id="${E(m.id)}" data-role="${m.role==='YOUTH_LEADER'?'MEMBER':'YOUTH_LEADER'}">${m.role==='YOUTH_LEADER'?'Set member':'Youth leader'}</button>`, `<button data-action="role" data-id="${E(m.id)}" data-role="${m.role==='ADMIN'?'MEMBER':'ADMIN'}">${m.role==='ADMIN'?'Remove admin':'Make admin'}</button>`);
 return options.join('')||`<span class="tiny">No actions</span>`}
function manageTab(){if(!['ADMIN','SUPER_ADMIN','YOUTH_LEADER'].includes(ui.user.role))return `<div class="notice error">Access denied.</div>`;const isAdmin=['ADMIN','SUPER_ADMIN'].includes(ui.user.role);return `${portalHeading('Lead with <span class="italic">purpose.</span>','Publish meaningful gatherings and keep your community informed.')}<div class="panel-2"><section class="panel"><div class="panel-title"><div><h2>${icon('calendar')} Create an event</h2><p>${isAdmin?'For all church ministries.':'Youth ministry events only.'}</p></div></div><form class="form-grid" data-form="event"><div class="field"><label for="event-title">Event name</label><input id="event-title" name="title" required maxlength="140" placeholder="e.g. Community gathering"></div><div class="field"><label for="event-description">Description</label><textarea id="event-description" name="description" maxlength="2000" placeholder="Tell members what to expect"></textarea></div><div class="form-row"><div class="field"><label for="event-date">Date & time</label><input id="event-date" name="starts_at" type="datetime-local" required></div><div class="field"><label for="event-location">Location</label><input id="event-location" name="location" maxlength="160" placeholder="Venue or online"></div></div><div class="form-row"><div class="field"><label for="event-ministry">Ministry</label><select id="event-ministry" name="ministry">${(isAdmin?['General','Youth','Worship','Community','Outreach']:['Youth']).map(v=>`<option>${v}</option>`).join('')}</select></div><div class="field"><label for="event-visibility">Who can see this?</label><select id="event-visibility" name="visibility">${(isAdmin?['PUBLIC','MEMBERS','YOUTH']:['MEMBERS','YOUTH']).map(v=>`<option value="${v}">${v.toLowerCase()}</option>`).join('')}</select></div></div><button class="btn btn-dark" type="submit">${icon('plus')} Publish event</button></form></section>
 <section class="panel"><div class="panel-title"><div><h2>Upcoming content</h2><p>Remove items that are no longer needed.</p></div></div>${ui.events.filter(x=>isAdmin||x.ministry==='Youth').map(x=>`<div class="list-row"><div class="row-icon">${icon('calendar')}</div><div><h3>${E(x.title)}</h3><p>${E(fmtDate(x.starts_at))}</p></div><button class="btn btn-outline btn-small" data-action="delete-content" data-type="events" data-id="${E(x.id)}">Remove</button></div>`).join('')||empty('No events','Create an event to see it here.')}</section></div>${isAdmin?`<div class="panel-2"><section class="panel"><div class="panel-title"><h2>Publish an announcement</h2></div><form class="form-grid" data-form="announcement"><div class="field"><label for="announcement-title">Title</label><input id="announcement-title" name="title" required maxlength="140"></div><div class="field"><label for="announcement-body">Message</label><textarea id="announcement-body" name="body" maxlength="3000" required></textarea></div><div class="field"><label for="announcement-vis">Visibility</label><select id="announcement-vis" name="visibility"><option value="PUBLIC">Public website</option><option value="MEMBERS">Approved members</option><option value="YOUTH">Youth</option></select></div><button class="btn btn-dark" type="submit">${icon('plus')} Publish announcement</button></form></section><section class="panel"><div class="panel-title"><div><h2>Church AI knowledge</h2><p>Provide verified answers the assistant may use.</p></div></div><form class="form-grid" data-form="knowledge"><div class="field"><label for="knowledge-question">Common question</label><input id="knowledge-question" name="question" maxlength="250" required placeholder="How do I join a ministry?"></div><div class="field"><label for="knowledge-answer">Church-approved answer</label><textarea id="knowledge-answer" name="answer" maxlength="2000" required></textarea></div><button class="btn btn-outline" type="submit">${icon('book')} Add knowledge</button></form><div style="margin-top:18px">${ui.knowledge.slice(0,4).map(k=>`<div class="list-row"><div><h3>${E(k.question)}</h3><p>${E(k.answer)}</p></div></div>`).join('')}</div></section></div>`:''}`}
function auditTab(){if(ui.user.role!=='SUPER_ADMIN')return `<div class="notice error">Access denied.</div>`;return `${portalHeading('Security & <span class="italic">accountability.</span>','Review recent administrative changes made in your portal.')}<section class="panel"><div class="panel-title"><h2>Audit log</h2><span class="tag">Last 100 actions</span></div>${ui.audit.map(a=>`<div class="list-row"><div class="row-icon">${icon('shield')}</div><div><h3>${E(a.action.replaceAll('_',' '))}</h3><p>${E(a.actor_name)} · ${E(fmtDate(a.created_at))}</p></div></div>`).join('')||empty('No activity yet','Administrative actions will be tracked here.')}</section>`}
function signInPage(){return `<div class="signin-page"><div class="signin-side">${brand(true)}<div class="signin-quote"><div class="eyebrow" style="color:#e6c99e;margin-bottom:25px">A community to call home</div><h1>Your place <em>starts here.</em></h1><p>One simple sign-in, one caring community. We cannot wait to get to know you.</p></div><div class="signin-bottom">Haven Church · Faith. Family. Purpose.</div></div><main class="signin-main"><div class="signin-box"><a href="#home" class="back-link" data-action="site">${icon('arrow')} Back to the website</a><div class="eyebrow">Member access</div><h2>Welcome to <span class="italic">Haven.</span></h2><p>Sign in securely with your Google account. New here? Your application will be sent to our church administrators for approval.</p><button type="button" class="google-button" data-action="google"><span class="google-g" aria-hidden="true">G</span> Continue with Google ${icon('arrow')}</button><div class="signin-legal">${icon('lock')} Your account starts as <strong>Pending</strong> until approved. We only use your verified name, email and profile image for membership administration. Your Google password is never shared with this website.</div></div></main></div>`}
function pending(){const s=ui.user.status;const denied=s==='REJECTED'||s==='SUSPENDED';return `<div class="approval-shell">${brand()}<div class="panel"><span class="approval-status">${icon(denied?'lock':'clock')} ${E(denied?s==='REJECTED'?'Application declined':'Membership suspended':'Approval pending')}</span><h1>${denied?'A conversation starts here.':'You’re almost home.'}</h1><p>${denied?'Your account is not currently eligible for member access. Please speak to your church administrator for next steps.':'Your Google sign-in worked and your membership request has been received. A church admin will review it before you can enter the private portal.'}</p><p class="tiny">Signed in as ${E(ui.user.email)} · Account status: ${E(s)}</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px"><button class="btn btn-dark" data-action="refresh">Check approval ${icon('arrow')}</button><button class="btn btn-outline" data-action="site">Back to website</button><button class="btn btn-ghost" data-action="logout">Sign out</button></div></div><p class="tiny">Your access status is checked by the server on every protected request.</p></div>`}
function render(){app.innerHTML=ui.view==='portal'?portal():ui.view==='signin'?signInPage():site()}
function toast(message,bad=false){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=message;el.setAttribute('role','status');document.body.appendChild(el);setTimeout(()=>el.remove(),5000)}
async function openPortal(tab='overview'){if(!ui.user){ui.view='signin';location.hash='signin';render();return}ui.view='portal';ui.tab=tab;location.hash='portal';render();await loadPortal();if(ui.view==='portal')render()}
async function openTab(tab){ui.tab=tab;render();try{
  if(tab==='members')await fetchMembers();
  if(tab==='manage'&&['ADMIN','SUPER_ADMIN'].includes(ui.user.role)){ui.knowledge=(await api('/api/knowledge')).items||[]}
  if(tab==='audit')ui.audit=(await api('/api/audit')).items||[];
  if(['overview','events','announcements','manage'].includes(tab))await loadPortal();
 }catch(e){toast(e.message,true)}render()}
async function fetchMembers(){const query=ui.filter!=='ALL'?`?status=${encodeURIComponent(ui.filter)}`:'';ui.members=(await api('/api/members'+query)).items||[]}
async function onAction(el){const action=el.dataset.action;
 if(action==='menu'){ui.menu=!ui.menu;render();return}
 if(action==='site'){ui.view='site';ui.menu=false;location.hash='home';render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='scroll'){const target=el.dataset.target;ui.view='site';ui.menu=false;render();requestAnimationFrame(()=>document.getElementById(target)?.scrollIntoView({behavior:'smooth'}));return}
 if(action==='portal'){await openPortal();return}
 if(action==='google'){ui.user={id:'demo-owner',name:'Alex Jordan',email:'alex@example.org',status:'APPROVED',role:'SUPER_ADMIN'};await openPortal();toast('Demo mode only — no Google sign-in occurred.');return}
 if(action==='tab'){await openTab(el.dataset.tab);return}
 if(action==='refresh'){try{const result=await api('/api/me');ui.user=result.user;if(ui.user?.status==='APPROVED')await openPortal();else{render();toast('Your request is still '+(ui.user?.status||'pending').toLowerCase())}}catch(e){toast(e.message,true)}return}
 if(action==='logout'){try{await api('/api/auth/logout',{method:'POST',body:'{}'});ui.user=null;ui.view='site';ui.tab='overview';ui.chat=[];render();location.hash='home';toast('You have signed out.')}catch(e){toast(e.message,true)}return}
 if(action==='status'){const id=el.dataset.id, status=el.dataset.value;if(!window.confirm(`Change this member's status to ${status.toLowerCase()}?`))return;try{await api(`/api/members/${encodeURIComponent(id)}/status`,{method:'POST',body:JSON.stringify({status})});await fetchMembers();render();toast('Membership status updated')}catch(e){toast(e.message,true)}return}
 if(action==='role'){const id=el.dataset.id, role=el.dataset.role;if(!window.confirm(`Set this person's role to ${role.replace('_',' ').toLowerCase()}?`))return;try{await api(`/api/members/${encodeURIComponent(id)}/role`,{method:'POST',body:JSON.stringify({role})});await fetchMembers();render();toast('Role updated')}catch(e){toast(e.message,true)}return}
 if(action==='delete-content'){const id=el.dataset.id,type=el.dataset.type;if(!window.confirm('Remove this item?'))return;try{await api(`/api/${type}/${encodeURIComponent(id)}`,{method:'DELETE'});await loadPortal();render();toast('Content removed')}catch(e){toast(e.message,true)}}
}
async function onForm(form){const type=form.dataset.form, values=Object.fromEntries(new FormData(form));if(ui.busy)return;ui.busy=true;const submit=form.querySelector('[type="submit"]');if(submit)submit.disabled=true;
 try{
  if(type==='chat'){
   const message=String(values.message||'').trim();if(!message)return;
   ui.chat.push({from:'user',text:message});render();
   const response=await api('/api/assistant',{method:'POST',body:JSON.stringify({message})});ui.chat.push({from:'assistant',text:response.answer});render();
  }else if(type==='event'){
   const starts_at=new Date(values.starts_at).toISOString();await api('/api/events',{method:'POST',body:JSON.stringify({...values,starts_at})});await loadPortal();render();toast('Event published successfully');
  }else if(type==='announcement'){
   await api('/api/announcements',{method:'POST',body:JSON.stringify(values)});await loadPortal();render();toast('Announcement published');
  }else if(type==='knowledge'){
   await api('/api/knowledge',{method:'POST',body:JSON.stringify(values)});ui.knowledge=(await api('/api/knowledge')).items||[];render();toast('Knowledge added to the assistant');
  }
 }catch(e){if(type==='chat'){ui.chat.push({from:'assistant',text:'Sorry, I could not answer that right now. '+e.message});render()}else toast(e.message,true)}
 finally{ui.busy=false;if(submit&&submit.isConnected)submit.disabled=false}
}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target){e.preventDefault();onAction(target)}});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(form){e.preventDefault();onForm(form)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter="members"]')){ui.filter=e.target.value;fetchMembers().then(render).catch(err=>toast(err.message,true))}});
(async()=>{
 render();
 try{const me=await api('/api/me');ui.user=me.user}catch{/* Public site still works without a configured backend. */}
 await loadPublic();
 if(location.hash==='#portal'){ui.view=ui.user?'portal':'signin';if(ui.user)await loadPortal()}
 if(location.hash==='#signin')ui.view='signin';
 render();
 if(new URL(location.href).searchParams.has('welcome')){
  history.replaceState(null,'',location.pathname+(location.hash||''));
  if(ui.user){if(ui.user.status==='APPROVED')await openPortal();else{ui.view='portal';render()}}
 }
 if(location.hash.startsWith('#')&&location.hash!=='#portal'){const section=document.getElementById(location.hash.slice(1));section?.scrollIntoView()}
})();
  </script>
